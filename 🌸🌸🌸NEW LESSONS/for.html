<!DOCTYPE html>
<html lang="az">

<head>
  <meta charset="UTF-8">
  <title>JS Tapşırıqlar</title>
</head>

<body>
  <script>
    let sum = 0;
    for (let n = 11; n <= 99; n += 2) {
      sum += n;
    }
    console.log(sum);
    //
    let product = 1;
    for (let i = 1; i <= 10; i++) {
      product *= i;
    }
    console.log("1-dən 10-a qədər ədədlərin hasili:", product);
    //
    let text = prompt("Mətn daxil edin:");
    if (text !== null) {
      let reversed = "";
      for (let i = text.length - 1; i >= 0; i--) {
        reversed += text[i];
      }
      console.log(reversed);
    }
  </script>
</body>

</html>
