<h1>GeForce 20</h1>

<ul>
    <li>GTX 1650</li>
    <li>GTX 1660</li>
    <li class="primary">GTX 1660 Ti</li>
    <li>RTX 2070</li>
    <li>RTX 2080</li>
    <li class="primary">RTX 2080 Ti</li>
</ul>

<script>
    const items = document.querySelectorAll("ul li");
    items.forEach(li => {
        li.classList.add("item");
        if (!li.classList.contains("primary")) {
            li.classList.add("secondary");
        }
    });
</script>
