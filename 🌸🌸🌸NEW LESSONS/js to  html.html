<!DOCTYPE html>
<html lang="az">

<head>
    <meta charset="UTF-8">
    <title>GeForce 20 Tasks</title>
</head>

<body>
    <h1>GeForce 20</h1>

    <ul>
        <li>GTX 1650</li>
        <li>GTX 1660</li>
        <li class="primary">GTX 1660 Ti</li>
        <li>RTX 2070</li>
        <li>RTX 2080</li>
        <li class="primary">RTX 2080 Ti</li>
    </ul>

    <script>
        // tap 1 
        let title = document.querySelector("h1");
        title.remove();

        let list = document.querySelector("ul");
        let newItem = document.createElement("li");
        newItem.textContent = "TITAN RTX";
        list.append(newItem);

        // tap 2 
        let newTitle = document.createElement("h1");
        newTitle.textContent = "GeForce 20 Series";
        document.body.prepend(newTitle);

        let primaryItems = document.querySelectorAll(".primary");
        for (let item of primaryItems) {
            item.style.backgroundColor = "#ebebeb";
        }

        // tap 3 
        for (let item of primaryItems) {
            console.log(item.textContent);
        }

    </script>
</body>

</html>
