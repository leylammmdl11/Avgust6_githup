<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
        #sigin-form {
            background-color: aquamarine;
            padding: 20px 10px;
            display: flex;
            flex-direction: column;
            width: 400px;
        }

        #sigin-form input {
            padding: 5px;
            border: none;
            border-radius: 5px;
        }

        #sigin-form button {
            border: none;
            padding: 10px;
            background-color: darkblue;
            color: white;
            border-radius: 5px;
        }

        .container {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mt-5 {
            margin-top: 5px;
        }
    </style>
</head>

<body>
    <div class="container">
        <form id="sigin-form">
            <label class="mt-5" for="name">Name: </label>
            <input class="mt-5" type="text" name="name" id="name" required />
            <label class="mt-5" for="surname">Surname:</label>
            <input class="mt-5" type="text" name="surname" id="surname" required />
            <button class="mt-5">Submit</button>
        </form>
    </div>

    <script>
        let signInForm = document.getElementById("sigin-form");
        signInForm.addEventListener("submit", subFunc);
        function subFunc(e) {
            e.preventDefault();
            let formDataObj = new FormData(e.target);
            let obj = {};
            for (const [key, value] of formDataObj.entries()) {
                obj[key] = value;
            }
            console.log(obj);
        }
    </script>
</body>

</html>
