<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<style>
    .container {
        display: flex;
        justify-content: space-between;
    }

    .shop-item {
        border: 1px solid #ccc;
        width: 200px;
        border-radius: 20px;
    }

    .shop-item img {
        width: 100%;
        height: 120px;
        object-fit: cover;
        border-radius: 20px;
    }

    .shop-item h3,
    .shop-item .desc,
    .shop-item .price {
        padding: 3px;
        margin: 5px 0;
    }

    .shop-item .price {
        font-weight: bold;
    }
</style>

<body>

    <div class="container"></div>

    <script>
        const products = [
            {
                img: "https://i.pinimg.com/1200x/2a/ef/af/2aefaf257633b98a0ef591ddf4e69813.jpg",
                name: "Necklace",
                desc: "from beautiful stones",
                price: "25 AZN"
            },
            {
                img: "https://i.pinimg.com/1200x/07/f7/44/07f744a523dcdd750c0e15ea9c29b5af.jpg",
                name: "Bracelet",
                desc: "handmade jewelry",
                price: "18 AZN"
            },
            {
                img: "https://i.pinimg.com/736x/2c/14/83/2c1483fd0d3769beaa3c0ca2bccb1e74.jpg",
                name: "Ring",
                desc: "silver-plated ring",
                price: "12 AZN"
            }
        ];

        const container = document.querySelector(".container");

        products.forEach(item => {
            const div = document.createElement("div");
            div.classList.add("shop-item");

            div.innerHTML = `
                <img src="${item.img}" alt="">
                <h3>${item.name}</h3>
                <p class="desc">${item.desc}</p>
                <p class="price">${item.price}</p>
            `;

            container.append(div); 
        });
    </script>

</body>

</html>
