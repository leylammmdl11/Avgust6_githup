<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Boutique - Profile</title>
  <link rel="icon" type="image/png"
    href="https://png.pngtree.com/png-clipart/20220806/ourmid/pngtree-outlined-leaves-decoration-with-watercolor-flowers-bouquet-frame-png-image_6101124.png">
  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
      background-size: cover;
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 70px;
      background-color: #fce4ec;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;
    }

    .sidebar img {
      width: 32px;
      height: 32px;
      margin: 25px 0;
      background-color: #fff0f6;
      border-radius: 30%;
      padding: 8px;
      transition: background 0.3s;
      cursor: pointer;
    }

    .sidebar img:hover {
      background-color: #f8bbd0;
    }

    .content {
      flex: 1;
      padding: 30px;
      color: #333;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .top-bar button {
      background-color: #f48fb1;
      border: none;
      color: white;
      padding: 10px 15px;
      border-radius: 10px;
      cursor: pointer;
    }

    .profile {
      margin-top: 30px;
      display: flex;
      align-items: center;
      gap: 20px;

    }

    .profile-pic {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      overflow: hidden;
      background-color: #fce4ec;
    }

    .profile-pic img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .profile-info h2 {
      margin: 0;
      font-size: 1.5rem;
    }

    .profile-info a {
      color: #ec407a;
      font-size: 0.9rem;
      text-decoration: none;
    }

    .products {
      margin-top: 40px;
      width: 200px;
    }

    .products h3 {
      font-size: 1.3rem;
      color: #880e4f;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
     
    }

    .card {
      background-color: #fff0f6;
      padding: 15px;
      border-radius: 15px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 180px;
      height: 150px;
      object-fit: cover;
      border-radius: 10px;
    }

    .card h4 {
      margin: 10px 0 5px;
      font-size: 1rem;
    }

    .card button {
      margin-top: 5px;
      background-color: #f48fb1;
      border: none;
      color: white;
      padding: 6px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .profile {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>
  <div class="sidebar">
    <a href="index.html"><img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home"></a>
    <a href="cart.html"><img src="https://cdn-icons-png.flaticon.com/512/833/833314.png" alt="Cart"></a>
    <a href="home.html"><img style="width: 55px; height: 55px; background: none; border: none;"
        src="https://png.pngtree.com/png-clipart/20220806/ourmid/pngtree-outlined-leaves-decoration-with-watercolor-flowers-bouquet-frame-png-image_6101124.png"
        alt="Logo"></a>
    <a href="favorites.html"><img src="https://pngfre.com/wp-content/uploads/Black-Heart-2.png" alt="Favorites"></a>
    <a href="profile.html"><img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="User"></a>
  </div>

  <div class="content">
    <div class="top-bar">
      <h1>Welcome to your profile</h1>
      <button>Login with another account</button>
    </div>

    <div class="profile">
      <div class="profile-pic">
        <img src="https://i.pinimg.com/736x/60/ef/7e/60ef7ede4c2c3b58390cbf3d749d84d7.jpg" alt="User avatar">
      </div>
      <div class="profile-info">
        <h2>user_4166</h2>
        <a href="#">Edit ✏️</a>
        <p>About you.</p>
      </div>
    </div>

    <div class="products">
      <h3>For you</h3>
      <div class="product-grid">
        <div class="card">
          <img src="https://i.pinimg.com/736x/6b/45/f0/6b45f04e2860ba8d504c79cdff1043ae.jpg" alt="Rose">
          <h4>Rose 40$</h4>
          <button>Buy</button>
        </div>
        <div class="card">
          <img src="https://i.pinimg.com/736x/80/61/f0/8061f0bf55650468e3cd0cc9d5baa94c.jpg" alt="Lavander">
          <h4>Lavander 35$</h4>
          <button>Buy</button>
        </div>
        <div class="card">
          <img src="https://i.pinimg.com/736x/d1/1e/ba/d11eba27ab677a8a922627296ed6cf33.jpg"
            alt="Tulip">
          <h4>Tulip 40$</h4>
          <button>Buy</button>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
