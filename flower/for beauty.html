<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flower Boutique</title>
  <link rel="icon" type="image/png" href="https://png.pngtree.com/png-clipart/20220806/ourmid/pngtree-outlined-leaves-decoration-with-watercolor-flowers-bouquet-frame-png-image_6101124.png">

  <style>
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background-image: url("https://www.transparenttextures.com/patterns/asfalt-dark.png");
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: 70px;
      background-color: #efdece;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 20px;


    }

    .sidebar img:hover {
      background-color: #ddb1bf;
    }

    .sidebar img {
      width: 32px;
      height: 32px;
      cursor: pointer;
      filter: drop-shadow(0 0 15px #da9ed2);
      padding: 8px;
      border-radius: 30%;
      background-color: #ffecd7;
      margin: 30px;
      transition: background 0.5s;

    }

    .main {
      flex: 1;
      padding: 40px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 25px;
    }

    .card {
      background-color: #fff0f6;
      border-radius: 20px;
      padding: 15px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.07);
      text-align: center;
      transition: transform 0.3s ease, box-shadow 0.3s ease;
      position: relative;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 12px 20px rgba(0, 0, 0, 0.1);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 15px;
      background-color: #f7f7f7;
    }

    .card .name {
      font-weight: 600;
      margin-top: 10px;
      font-size: 1.1rem;
    }

    .card .price {
      font-weight: bold;
      color: #d26fa4;
      margin: 6px 0;
    }

    .buy-btn {
      background-color: #f48fb1;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s;
    }

    .buy-btn:hover {
      background-color: #ec407a;
    }

    .favorite {
      position: absolute;
      top: 12px;
      right: 12px;
      font-size: 20px;
      color: #f06292;
      cursor: pointer;
    }

    @media (max-width: 600px) {
      .main {
        padding: 20px 10px;
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
<div class="sidebar">
  <a href="index.html">
    <img src="https://cdn-icons-png.flaticon.com/512/1946/1946488.png" alt="Home">
  </a>

  <a href="cart.html">
    <img src="https://cdn-icons-png.flaticon.com/512/833/833314.png" alt="Cart">
  </a>

  <a href="home.html">
    <img style="border: none; background: none; width: 55px; height: 55px;"
      src="https://png.pngtree.com/png-clipart/20220806/ourmid/pngtree-outlined-leaves-decoration-with-watercolor-flowers-bouquet-frame-png-image_6101124.png"
      alt="Logo">
  </a>

  <a href="favorites.html">
    <img src="https://pngfre.com/wp-content/uploads/Black-Heart-2.png" alt="Favorites">
  </a>

  <a href="profile.html">
    <img src="https://cdn-icons-png.flaticon.com/512/1077/1077063.png" alt="User">
  </a>
</div>


  <div class="main">

  </div>
</body>

</html>
