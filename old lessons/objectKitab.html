<script>
    const kitab = {
        ad: "Harry Potter",
        müəllif: "J.K. Rowling",
        səhifəSayi: 500,
        oxunub: true,


        məlumatVer: function () {
            console.log(`Kitabın adı ${this.ad}-dır. Müəllifi ${this.müəllif}dir. ${this.səhifəSayi} səhifədir.`);


            if (this.oxunub) {
                console.log("Bu kitab artıq oxunub.");
            } else {
                console.log("Bu kitab hələ oxunmayıb.");
            }
        }
    };

    kitab.məlumatVer();
</script>
