<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Contact</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        body {
            font-family: 'Trebuchet MS', Arial, sans-serif;
        }

        .top-sale {
            background: #dc3545;
            color: #fff;
            text-align: center;
            padding: 6px;
            font-size: 14px;
        }

        .navbar {
            padding: 15px;
        }

        .navbar-nav {
            gap: 10px;
        }

        .nav-link {
            color: #222;
            padding: 8px 14px;
            border-radius: 6px;
            transition: .3s;
        }

        .nav-link:hover {
            background: #dc3545;
            color: #fff;
        }

        .page-container {
            width: 90%;
            max-width: 1200px;
            margin: 50px auto;
        }


        .section-title {
            font-size: 26px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 30px;
        }

        .section-title::before {
            content: "";
            width: 10px;
            height: 26px;
            background: #dc3545;
            border-radius: 2px;
        }

        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 30px;
        }

        .contact-info,
        .contact-form {
            background: #f8f8f8;
            padding: 30px;
            border-radius: 16px;
        }


        .info-box {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
        }

        .icon {
            width: 46px;
            height: 46px;
            background: #dc3545;
            color: #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .info-box h4 {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 6px;
        }

        .info-box p {
            font-size: 14px;
            color: #666;
            margin: 0;
        }

        hr {
            border: none;
            border-top: 1px solid #ddd;
            margin: 25px 0;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 15px;
        }

        input,
        textarea {
            width: 100%;
            padding: 12px;
            background: #fff;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 14px;
        }

        textarea {
            height: 160px;
            resize: none;
        }

        .send-btn {
            background: #dc3545;
            color: #fff;
            border: none;
            padding: 12px 32px;
            border-radius: 10px;
            float: right;
            transition: .3s;
        }

        .send-btn:hover {
            background: #bb2d3b;
        }

        .validation-msg {
            font-size: 13px;
            margin-top: 3px;
            display: block;
        }

        .validation-msg.error {
            color: red;
        }

        .validation-msg.success {
            color: green;
        }



        @media(max-width: 900px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .send-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>
    <div class="top-sale">SUMMER SALE 50% OFF | FREE SHIPPING OVER $150</div>

    <nav class="navbar navbar-expand-lg bg-white">
        <div class="container">
            <a class="navbar-brand">E-COMMERCE</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="nav">
                <ul class="navbar-nav">
                    <li class="nav-item"><a class="nav-link" href="home.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
                    <li class="nav-item"><a class="nav-link" href="sing up.html">Sign Up</a></li>
                    <li class="nav-item"><a class="nav-link" href="shop.html">Shop</a></li>
                </ul>
                <div class="ms-auto d-flex align-items-center gap-3">

                    <div class="search-box d-flex">
                        <input class="form-control" placeholder="What are you looking for?"
                            style="border-top-right-radius:0; border-bottom-right-radius:0;">
                        <button class="btn btn-outline-secondary"
                            style="border-top-left-radius:0; border-bottom-left-radius:0;">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>


                    <button class="btn position-relative" style="font-size:22px;">
                        <a href="basket.html"><i class="bi bi-cart"></i></a>
                    </button>


                    <button class="btn" style="font-size:22px;">
                        <a href="profile.html"><i class="bi bi-person"></i></a>
                    </button>

                    <a href="login.html" class="btn btn-outline-dark btn-sm">Login</a>

                </div>

            </div>
    </nav>

    <div class="page-container">

        <div class="section-title">Contact Us</div>

        <div class="contact-wrapper">

            <div class="contact-info">
                <div class="info-box">
                    <div class="icon"><i class="bi bi-telephone"></i></div>
                    <div>
                        <h4>Call To Us</h4>
                        <p>Available 24/7</p>
                        <p>+8801611112222</p>
                    </div>
                </div>

                <hr>

                <div class="info-box">
                    <div class="icon"><i class="bi bi-envelope"></i></div>
                    <div>
                        <h4>Write To Us</h4>
                        <p>customer@exclusive.com</p>
                        <p>support@exclusive.com</p>
                    </div>
                </div>
            </div>

            <div class="contact-form">
                <form id="contactForm">
                    <div class="form-row">
                        <div>
                            <input type="text" id="name" placeholder="Your Name *" required>
                            <span class="validation-msg" id="nameMsg"></span>
                        </div>
                        <div>
                            <input type="email" id="email" placeholder="Your Email *" required>
                            <span class="validation-msg" id="emailMsg"></span>
                        </div>
                        <div>
                            <input type="text" id="phone" placeholder="Your Phone *" required>
                            <span class="validation-msg" id="phoneMsg"></span>
                        </div>
                    </div>

                    <div>
                        <textarea id="message" placeholder="Your Message"></textarea>
                        <span class="validation-msg" id="messageMsg"></span>
                    </div>

                    <br><br>
                    <button class="send-btn" type="submit">Send Message</button>
                </form>
            </div>


        </div>
    </div>
    <script>const form = document.getElementById("contactForm");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const name = document.getElementById("name");
            const email = document.getElementById("email");
            const phone = document.getElementById("phone");
            const message = document.getElementById("message");

            const nameMsg = document.getElementById("nameMsg");
            const emailMsg = document.getElementById("emailMsg");
            const phoneMsg = document.getElementById("phoneMsg");
            const messageMsg = document.getElementById("messageMsg");

            let valid = true;

           
            if (name.value.trim() === "") {
                nameMsg.textContent = "Name is required";
                nameMsg.className = "validation-msg error";
                valid = false;
            } else {
                nameMsg.textContent = "Looks good!";
                nameMsg.className = "validation-msg success";
            }

            
            const emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;
            if (!email.value.match(emailPattern)) {
                emailMsg.textContent = "Valid email required";
                emailMsg.className = "validation-msg error";
                valid = false;
            } else {
                emailMsg.textContent = "Looks good!";
                emailMsg.className = "validation-msg success";
            }


            const phonePattern = /^[0-9]{7,15}$/;
            if (!phone.value.match(phonePattern)) {
                phoneMsg.textContent = "Valid phone number required";
                phoneMsg.className = "validation-msg error";
                valid = false;
            } else {
                phoneMsg.textContent = "Looks good!";
                phoneMsg.className = "validation-msg success";
            }


            if (message.value.trim() === "") {
                messageMsg.textContent = "Message cannot be empty";
                messageMsg.className = "validation-msg error";
                valid = false;
            } else {
                messageMsg.textContent = "Looks good!";
                messageMsg.className = "validation-msg success";
            }

            if (valid) {
                alert("Message sent successfully!");
                form.reset();
                nameMsg.textContent = "";
                emailMsg.textContent = "";
                phoneMsg.textContent = "";
                messageMsg.textContent = "";
            }
        });

    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
