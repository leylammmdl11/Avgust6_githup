<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        console.log ("abs:  " + Math.abs( -73))
        console.log ("sqrt: " + Math.sqrt(169))
        console.log ("pow: " + Math.pow(4, 3))
        console.log ("ceil: " + Math.ceil(2.555555))
        console.log ("floor: " + Math.floor(2.99999))
        console.log ("round: " + Math.round(3.7))
        console.log ("min: " + Math.min(5,3,4,2,1,8))
        console.log ("max: " + Math.max(6,8,3,4,5,7))
        console.log ("PI: " + Math.PI)
        console.log ("random: " + Math.random)
        

    </script>
</body>
